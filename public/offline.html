<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpotId — You're offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f7ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      font-size: 36px;
      font-weight: 900;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 800; color: #111827; margin-bottom: 8px; }
    p { font-size: 15px; color: #6b7280; max-width: 320px; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="logo">SpotId</div>
  <div class="icon">📶</div>
  <h1>You're offline</h1>
  <p>Check your connection and try again. Your tags are safe — they'll sync when you're back online.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background gradient: indigo top-left to purple bottom-right -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- White pin inner highlight -->
    <radialGradient id="pinHighlight" cx="36%" cy="30%" r="52%">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle inner shadow for depth on white pin -->
    <filter id="pinInnerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3730a3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Gradient background square with rounded corners -->
  <rect x="0" y="0" width="200" height="200" rx="24" fill="url(#bgGrad)"/>

  <!-- White pin centered on canvas -->
  <!-- Pin: circle center (100, 84), radius 38, tip at (100, 168) -->
  <!-- Canvas: 200x200, so center x=100 -->
  <g filter="url(#pinInnerShadow)">
    <path d="
      M 62 84
      A 38 38 0 1 1 138 84
      A 38 38 0 0 1 134.4 103
      L 100 168
      L 65.6 103
      A 38 38 0 0 1 62 84
      Z
    " fill="white"/>
  </g>

  <!-- Highlight on white pin (subtle, slightly off-white) -->
  <path d="
    M 62 84
    A 38 38 0 1 1 138 84
    A 38 38 0 0 1 134.4 103
    L 100 168
    L 65.6 103
    A 38 38 0 0 1 62 84
    Z
  " fill="url(#pinHighlight)"/>

  <!-- # symbol in gradient color inside pin circle, centered at (100, 84) -->
  <!-- Use gradient color for # on white pin for brand cohesion -->
  <rect x="92" y="66" width="4.5" height="36" rx="2.25" fill="#7c3aed"/>
  <rect x="103.5" y="66" width="4.5" height="36" rx="2.25" fill="#7c3aed"/>
  <rect x="86" y="77" width="28" height="4.5" rx="2.25" fill="#7c3aed"/>
  <rect x="86" y="89.5" width="28" height="4.5" rx="2.25" fill="#7c3aed"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <!-- Pin gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Inner circle highlight -->
    <radialGradient id="pinHighlight" cx="36%" cy="30%" r="52%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop shadow on pin -->
    <filter id="pinShadow" x="-60%" y="-40%" width="220%" height="240%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#4f46e5" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Pin: circle center (37, 30), radius 25, tip at (37, 72) -->
  <!-- Scale: 50px wide (r=25), ~68px tall (top of circle y=5, tip y=72) -->
  <g filter="url(#pinShadow)">
    <path d="
      M 12 30
      A 25 25 0 1 1 62 30
      A 25 25 0 0 1 59.5 43
      L 37 72
      L 14.5 43
      A 25 25 0 0 1 12 30
      Z
    " fill="url(#pinGrad)"/>
  </g>

  <!-- Highlight -->
  <path d="
    M 12 30
    A 25 25 0 1 1 62 30
    A 25 25 0 0 1 59.5 43
    L 37 72
    L 14.5 43
    A 25 25 0 0 1 12 30
    Z
  " fill="url(#pinHighlight)"/>

  <!-- # symbol centered in circle (cx=37, cy=30), scaled for r=25 -->
  <rect x="30.5" y="18" width="3.5" height="24" rx="1.75" fill="white"/>
  <rect x="40" y="18" width="3.5" height="24" rx="1.75" fill="white"/>
  <rect x="26" y="24.5" width="22" height="3.5" rx="1.75" fill="white"/>
  <rect x="26" y="33" width="22" height="3.5" rx="1.75" fill="white"/>

  <!-- "SpotId" wordmark — vertically centered: pin center is y=30, text baseline ~36 -->
  <text x="76" y="38" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="32" letter-spacing="-0.4">
    <tspan font-weight="800" fill="#4f46e5">Spot</tspan><tspan font-weight="800" font-style="italic" fill="#7c3aed" font-family="Georgia, 'Times New Roman', serif">I</tspan><tspan font-weight="800" font-style="italic" fill="#7c3aed">d</tspan>
  </text>
</svg>

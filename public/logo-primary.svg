<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280">
  <defs>
    <!-- Pin gradient: indigo top to purple bottom -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Inner circle highlight -->
    <radialGradient id="pinHighlight" cx="36%" cy="30%" r="52%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop shadow on pin -->
    <filter id="pinShadow" x="-50%" y="-30%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.30"/>
    </filter>
    <!-- Grounding ellipse blur -->
    <filter id="groundBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Grounding shadow ellipse under pin tip -->
  <ellipse cx="160" cy="173" rx="20" ry="5" fill="#3730a3" opacity="0.18" filter="url(#groundBlur)"/>

  <!-- Pin shape: circle center (160, 76), radius 40, tip at (160, 170) -->
  <g filter="url(#pinShadow)">
    <path d="
      M 120 76
      A 40 40 0 1 1 200 76
      A 40 40 0 0 1 196 96
      L 160 170
      L 124 96
      A 40 40 0 0 1 120 76
      Z
    " fill="url(#pinGrad)"/>
  </g>

  <!-- Highlight overlay on pin -->
  <path d="
    M 120 76
    A 40 40 0 1 1 200 76
    A 40 40 0 0 1 196 96
    L 160 170
    L 124 96
    A 40 40 0 0 1 120 76
    Z
  " fill="url(#pinHighlight)"/>

  <!-- White # symbol centered in pin circle (circle center: 160, 76) -->
  <!-- Vertical bars -->
  <rect x="151" y="57" width="5" height="38" rx="2.5" fill="white"/>
  <rect x="164" y="57" width="5" height="38" rx="2.5" fill="white"/>
  <!-- Horizontal bars -->
  <rect x="145" y="68" width="30" height="5" rx="2.5" fill="white"/>
  <rect x="145" y="81" width="30" height="5" rx="2.5" fill="white"/>

  <!-- "SpotId" wordmark -->
  <text x="160" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="-0.3">
    <tspan font-weight="800" fill="#4f46e5">Spot</tspan><tspan font-weight="800" font-style="italic" fill="#7c3aed">Id</tspan>
  </text>

  <!-- Tagline -->
  <text x="160" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#9ca3af" letter-spacing="0.05em">Tag yourself. Get spotted.</text>
</svg>
